# Blueprint do Render: cria o serviço com um clique (Dashboard → New → Blueprint)
services:
  - type: web
    name: atelie-da-beleza
    runtime: node
    plan: starter            # disco persistente exige plano pago (a partir do Starter)
    rootDir: server
    buildCommand: node -v
    startCommand: node --disable-warning=ExperimentalWarning server.js
    healthCheckPath: /api/health
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/atelie.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # o Render pede a senha ao criar o serviço
